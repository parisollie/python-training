[tool.poetry]
name = "python-training"
version = "0.1.0"
description = "Capacitación Python con Rick and Morty"
authors = ["parisollie <pjff18@gmail.com>"]
readme = "README.md"
packages = [
    {include = "python_training", from = "src"},
    {include = "rickmorty_orders", from = "05_proyecto_final/rickmorty_orders/src"},
    {include = "clean_arch", from = "04_laboratorios/lab_16_clean_arch/src"},
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = {extras = ["email"], version = "^2.14.1"}
httpx = "^0.28.1"
sqlalchemy = "^2.1.4"
alembic = "^1.20.0"
fastapi = "^0.143.1"
uvicorn = {version = "^0.54.0", extras = ["standard"]}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.32"
numpy = "^2.5.4"
pandas = "^3.0.6"
scikit-learn = "^1.9.1"
joblib = "^1.6.0"
pydantic-settings = "^2.16.0"
typer = "^0.27.3"
rich = "^15.0.0"
urllib3 = "^2.8.0"
grpcio = "^1.85.0"
grpcio-tools = "^1.85.0"
redis = "^8.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.10"
black = "^26.10.0"
isort = "^9.0.2"
mypy = "^2.4.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.2"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
types-python-jose = "^3.5.0.20260408"
hypothesis = "^6.169.1"
pytest-asyncio = "^1.4.0"
pandas-stubs = "^3.0.5.260914"
pip-audit = "^2.10.1"
types-grpcio = "^1.84.0.20261021"

[tool.poetry.scripts]
rickmorty-orders = "rickmorty_orders.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "05_proyecto_final/rickmorty_orders/alembic/versions/",
]


# Los stubs de gRPC (generados por protoc) no se editan a mano.
# Los nombres CamelCase de RPC son obligatorios por el contrato .proto,
# por lo que N802 no aplica a server.py (donde heredamos esos nombres).
[tool.ruff.lint.per-file-ignores]
"**/orders_pb2.py" = ["E501"]
"**/orders_pb2_grpc.py" = ["N802", "E501"]
"**/grpc/server.py" = ["N802"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "^05_proyecto_final/rickmorty_orders/alembic/versions/",
    "^05_proyecto_final/rickmorty_orders/src/rickmorty_orders/grpc/orders_pb2\\.py$",
    "^05_proyecto_final/rickmorty_orders/src/rickmorty_orders/grpc/orders_pb2_grpc\\.py$",
]

# Stubs generados por protoc: no tienen anotaciones, tratarlos como Any.
[[tool.mypy.overrides]]
module = ["rickmorty_orders.grpc.orders_pb2", "rickmorty_orders.grpc.orders_pb2_grpc"]
ignore_missing_imports = true
follow_imports = "skip"

# Los imports opcionales (joblib/sklearn) se marcan sin stubs.
[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["04_laboratorios", "05_proyecto_final"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
