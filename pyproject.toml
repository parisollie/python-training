[tool.poetry]
name = "python-training"
version = "0.1.0"
description = "Capacitación Python con Rick and Morty"
authors = ["parisollie <pjff18@gmail.com>"]
readme = "README.md"
packages = [{include = "python_training", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = {extras = ["email"], version = "^2.14.1"}
httpx = "^0.28.1"
sqlalchemy = "^2.1.4"
alembic = "^1.20.0"
fastapi = "^0.143.1"
uvicorn = {version = "^0.54.0", extras = ["standard"]}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.32"
numpy = "^2.5.4"
pandas = "^3.0.6"
scikit-learn = "^1.9.1"
joblib = "^1.6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.10"
black = "^26.10.0"
isort = "^9.0.2"
mypy = "^2.4.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.2"
types-python-jose = "^3.5.0.20260408"
hypothesis = "^6.169.1"
pytest-asyncio = "^1.4.0"
pandas-stubs = "^3.0.5.260914"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["04_laboratorios"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true
